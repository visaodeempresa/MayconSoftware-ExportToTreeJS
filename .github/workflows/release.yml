name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Download SweetHome3D.jar
        run: |
          mkdir -p lib
          wget -q 'https://sourceforge.net/projects/sweethome3d/files/SweetHome3D/SweetHome3D-7.5/SweetHome3D-7.5.jar/download' \
            -O lib/SweetHome3D.jar

      - name: Build plugin with Ant
        run: ant build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MayconSoftware-ExportToTreeJS.sh3p
          generate_release_notes: true
